[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-rehab-intelligence"
version = "0.1.0"
description = "Integración acotada de Catastro y certificados energéticos"
requires-python = ">=3.11"
dependencies = ["pandas==2.3.3", "pyarrow==23.0.1", "shapely==2.1.2", "pyproj==3.7.2", "streamlit==1.50.0", "pydeck==0.9.1"]

[project.optional-dependencies]
geo = ["geopandas>=1.0,<2"]
dev = ["ruff==0.14.2"]
browser = ["playwright==1.56.0"]

[project.scripts]
madrid-rehab = "madrid_rehab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
